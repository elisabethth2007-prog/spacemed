[metadata]
name = spacemed
version = attr: spacemed.__version__.__version__
author = Elisabeth Thamm
author_email = elisabeth-sophie.thamm@charite.de
url = https://git.bihealth.org/spacemed-digital-literacy/2026/personal/elth11
description = Tools for SpaceMed Course
long_description = file: README.md
long_description_content_type = text/markdown

classifiers =
    License :: OSI Approved :: GNU General Public License v
    Programming Language :: Python :: 3
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering

[options]
package_dir =
    =src
packages = spacemed
zip_safe = True
include_package_data = True
install_requires =
    pandas
    scipy
